name: CI

on:
  push:
  pull_request:

env:
  GODOT_VERSION: 4.4.1

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    # The GUT suite in parts that run side by side: the unit tests, and
    # the scenario tests, which fly whole mission segments, dealt out
    # over the scenario parts by their time on the runners. A new
    # scenario file joins a part by itself.
    name: test (${{ matrix.part }})
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [unit, scenarios 1 of 7, scenarios 2 of 7, scenarios 3 of 7, scenarios 4 of 7, scenarios 5 of 7,
          scenarios 6 of 7, scenarios 7 of 7]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      - name: Import project
        run: timeout 300 ~/godot/godot --headless --path . --import

      - name: Run the ${{ matrix.part }} tests
        env:
          PART: ${{ matrix.part }}
        run: |
          if [ "$PART" = unit ]; then
            args=(-gdir=res://tests/unit/)
          else
            # "scenarios K of N": the scenario files dealt out over the N
            # parts by their seconds in .github/scenario_seconds.txt (60
            # for a file not listed), the longest first, each to the part
            # with the fewest so far; every part deals alike and runs the
            # Kth share. -gdir= drops .gutconfig.json's directories, so
            # only the files listed run.
            read -r _ k _ n <<< "$PART"
            declare -A secs
            while read -r name s; do
              secs[$name]=$s
            done < <(grep -E '^test_' .github/scenario_seconds.txt)
            mapfile -t files < <(
              find tests/scenarios -name 'test_*.gd' | while read -r f; do
                echo "${secs[$(basename "$f")]:-60} $f"
              done | LC_ALL=C sort -k1,1nr -k2,2)
            load=()
            for (( p = 0; p < n; p++ )); do load[p]=0; done
            list=()
            for line in "${files[@]}"; do
              read -r s f <<< "$line"
              best=0
              for (( p = 1; p < n; p++ )); do
                if (( load[p] < load[best] )); then best=$p; fi
              done
              load[best]=$(( load[best] + s ))
              if (( best == k - 1 )); then list+=("res://$f"); fi
            done
            echo "$PART: ${list[*]} (${load[k - 1]} s recorded)"
            if (( ${#list[@]} == 0 )); then
              echo "No scenario files for $PART"
              exit 1
            fi
            args=(-gdir= "-gtest=$(IFS=,; echo "${list[*]}")")
          fi
          ~/godot/godot --headless --path . -s addons/gut/gut_cmdln.gd "${args[@]}" -gexit

  test:
    # The check to require on main: it passes only when every part of the
    # suite passed, and fails when one failed or was cancelled.
    if: always()
    needs: suite
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Every part of the suite passed
        run: test "${{ needs.suite.result }}" = success

  build:
    # The PC VR presets (export_presets.cfg) exported with Godot's own
    # templates, and the Linux build flown headless for a minute of the
    # launch. A merge to main keeps the builds as the run's artifacts, and
    # a tag attaches them to its release as well.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      # Only the PC VR presets' templates, out of the 1.2 GB archive.
      - name: Cache the export templates
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-templates-${{ env.GODOT_VERSION }}-pc

      - name: Download the export templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dir"
          unzip -j -q templates.tpz templates/version.txt templates/linux_release.x86_64 \
            templates/windows_release_x86_64.exe templates/windows_release_x86_64_console.exe -d "$dir"
          rm templates.tpz

      - name: Import project
        run: timeout 300 ~/godot/godot --headless --path . --import

      - name: Export the PC VR presets
        run: |
          mkdir -p build/linux build/windows
          timeout 300 ~/godot/godot --headless --path . --export-release "PC VR (Linux)" build/linux/ApolloVR.x86_64
          timeout 300 ~/godot/godot --headless --path . --export-release "PC VR (Windows)" build/windows/ApolloVR.exe
          ls -l build/linux build/windows
          test -s build/linux/ApolloVR.x86_64 && test -s build/linux/ApolloVR.pck
          test -s build/windows/ApolloVR.exe && test -s build/windows/ApolloVR.pck

      # The exported build, not the editor: a minute of the launch, from
      # 20 s before liftoff, at 1x, with no error on the way.
      - name: Fly a minute of the launch on the Linux build
        run: |
          timeout 300 build/linux/ApolloVR.x86_64 --headless -- --phase=launch --quit-after=60 2>&1 | tee smoke.log
          grep -Eq "Main: flew [0-9]+ s of apollo_11 from launch" smoke.log
          if grep -E "SCRIPT ERROR|^ERROR" smoke.log; then exit 1; fi

      - name: Zip the builds
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        run: |
          cd build
          zip -qr ../ApolloVR-linux-x86_64.zip linux
          zip -qr ../ApolloVR-windows-x86_64.zip windows

      - name: Keep the builds
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: actions/upload-artifact@v4
        with:
          name: ApolloVR-pc-vr
          path: ApolloVR-*.zip
          retention-days: 30

      - name: Attach the builds to the tag's release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" ApolloVR-linux-x86_64.zip ApolloVR-windows-x86_64.zip --clobber

  lint:
    # Static checks that need no Godot binary. gdlint is advisory
    # (continue-on-error) until the pre-existing findings are triaged;
    # the data-file gate below is blocking because those files are
    # load-bearing and the check is exact.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gdlint
        run: pip install "gdtoolkit==4.5.0"

      - name: Lint GDScript (advisory)
        continue-on-error: true
        run: gdlint src scenes tests tools

      - name: Validate data files
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("data")
          files = sorted(root.rglob("*.json"))
          assert files, "no JSON data files found"
          for f in files:
              json.loads(f.read_text())  # every data file must parse

          # Load-bearing propulsion, docking and ELS numbers from
          # data/spacecraft.json: present, numeric and positive.
          sc = json.loads((root / "spacecraft.json").read_text())
          required = {
              "sps": ["thrust_n", "isp_s", "propellant_kg"],
              "dps": ["thrust_n", "isp_s", "propellant_kg"],
              "aps": ["thrust_n", "isp_s", "propellant_kg"],
              "sivb": ["thrust_n", "isp_s", "propellant_kg"],
              "docking": ["undock_speed_mps", "closing_max_mps"],
              "els": ["drogue_alt_m", "main_alt_m"],
          }
          for section, keys in required.items():
              assert section in sc, f"spacecraft.json: missing section '{section}'"
              for key in keys:
                  v = sc[section][key]
                  assert isinstance(v, (int, float)) and v > 0, \
                      f"spacecraft.json: {section}.{key} = {v!r}"
          print(f"OK: {len(files)} JSON files parse; required fields present and positive")
          PY

name: CI

on:
  push:
  pull_request:

env:
  GODOT_VERSION: 4.4.1

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    # The GUT suite in parts that run side by side: the unit tests, and
    # the scenario tests, which fly whole mission segments, dealt out in
    # turn over the scenario parts in file-name order. A new scenario file
    # joins a part by itself.
    name: test (${{ matrix.part }})
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [unit, scenarios 1 of 2, scenarios 2 of 2]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      - name: Import project
        run: timeout 300 ~/godot/godot --headless --path . --import

      - name: Run the ${{ matrix.part }} tests
        env:
          PART: ${{ matrix.part }}
        run: |
          if [ "$PART" = unit ]; then
            args=(-gdir=res://tests/unit/)
          else
            # "scenarios K of N": every Nth scenario file in name order,
            # starting from the Kth. -gdir= drops .gutconfig.json's
            # directories, so only the files listed run.
            read -r _ k _ n <<< "$PART"
            mapfile -t files < <(find tests/scenarios -name 'test_*.gd' | LC_ALL=C sort)
            list=()
            for i in "${!files[@]}"; do
              if (( i % n == k - 1 )); then list+=("res://${files[$i]}"); fi
            done
            if (( ${#list[@]} == 0 )); then
              echo "No scenario files for $PART"
              exit 1
            fi
            args=(-gdir= "-gtest=$(IFS=,; echo "${list[*]}")")
          fi
          ~/godot/godot --headless --path . -s addons/gut/gut_cmdln.gd "${args[@]}" -gexit

  test:
    # The check to require on main: it passes only when every part of the
    # suite passed, and fails when one failed or was cancelled.
    if: always()
    needs: suite
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Every part of the suite passed
        run: test "${{ needs.suite.result }}" = success

  lint:
    # Static checks that need no Godot binary. gdlint is advisory
    # (continue-on-error) until the pre-existing findings are triaged;
    # the data-file gate below is blocking because those files are
    # load-bearing and the check is exact.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gdlint
        run: pip install "gdtoolkit==4.5.0"

      - name: Lint GDScript (advisory)
        continue-on-error: true
        run: gdlint src scenes tests tools

      - name: Validate data files
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("data")
          files = sorted(root.rglob("*.json"))
          assert files, "no JSON data files found"
          for f in files:
              json.loads(f.read_text())  # every data file must parse

          # Load-bearing propulsion, docking and ELS numbers from
          # data/spacecraft.json: present, numeric and positive.
          sc = json.loads((root / "spacecraft.json").read_text())
          required = {
              "sps": ["thrust_n", "isp_s", "propellant_kg"],
              "dps": ["thrust_n", "isp_s", "propellant_kg"],
              "aps": ["thrust_n", "isp_s", "propellant_kg"],
              "sivb": ["thrust_n", "isp_s", "propellant_kg"],
              "docking": ["undock_speed_mps", "closing_max_mps"],
              "els": ["drogue_alt_m", "main_alt_m"],
          }
          for section, keys in required.items():
              assert section in sc, f"spacecraft.json: missing section '{section}'"
              for key in keys:
                  v = sc[section][key]
                  assert isinstance(v, (int, float)) and v > 0, \
                      f"spacecraft.json: {section}.{key} = {v!r}"
          print(f"OK: {len(files)} JSON files parse; required fields present and positive")
          PY
